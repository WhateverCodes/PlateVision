Global:
  model_name: en_PP-OCRv5_mobile_rec
  debug: false
  use_gpu: false
  epoch_num: 1
  log_smooth_window: 20
  print_batch_step: 1
  save_model_dir: C:\Users\Grace\Documents\Codex\2026-09-19\i-n\work\ocr_finetune_trial
  save_epoch_step: 10
  eval_batch_step:
  - 0
  - 20
  cal_metric_during_train: true
  pretrained_model: C:\Users\Grace\Documents\Codex\2026-09-19\i-n\work\paddle_downloads\en_PP-OCRv5_mobile_rec_pretrained
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  infer_img: null
  character_dict_path: ./ppocr/utils/dict/ppocrv5_en_dict.txt
  max_text_length: 25
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./output/rec/predicts_en_ppocrv5.txt
  d2s_train_image_shape:
  - 3
  - 48
  - 320
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 1.0e-05
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size:
          - 1
          - 3
          use_guide: true
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: 25
Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false
Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: C:\Users\Grace\Documents\Codex\2026-09-19\i-n\outputs\PlateVision1\data\ocr_finetune_audit_v1
    ext_op_transform_idx: 1
    label_file_list:
    - C:\Users\Grace\Documents\Codex\2026-09-19\i-n\outputs\PlateVision1\data\ocr_finetune_audit_v1\train.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecAug: null
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales:
    - - 320
      - 48
    first_bs: 2
    fix_bs: true
    divided_factor:
    - 8
    - 16
    is_training: true
  loader:
    shuffle: true
    batch_size_per_card: 2
    drop_last: false
    num_workers: 0
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: C:\Users\Grace\Documents\Codex\2026-09-19\i-n\outputs\PlateVision1\data\ocr_finetune_audit_v1
    label_file_list:
    - C:\Users\Grace\Documents\Codex\2026-09-19\i-n\outputs\PlateVision1\data\ocr_finetune_audit_v1\validation_PENDING_AUDIT.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 320
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 2
    num_workers: 0
